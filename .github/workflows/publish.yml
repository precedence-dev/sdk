name: Publish

# Two packages in this repo: @precedence-dev/sdk and @precedence-dev/viewer.
# Triggered only when either package's own version changes.
#
# Uses npm's OIDC Trusted Publishing — no NPM_TOKEN secret at all. npm
# verifies the OIDC claims (this exact repo + this exact workflow file) match
# whatever's configured as the package's trusted publisher on npmjs.com, then
# issues a short-lived publish token itself. One-time setup on npmjs.com, for
# BOTH packages: package page -> Settings -> "Trusted Publisher" -> GitHub
# Actions -> org "precedence-dev", repo "sdk", workflow
# ".github/workflows/publish.yml".
#
# The inline version check makes each job idempotent (safe on every matching
# push, and a bump to just one package doesn't try to republish the other)
# without depending on a third-party action's OIDC support.
on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/package.json"
      - "packages/viewer/package.json"
  workflow_dispatch: {} # manual re-run, e.g. right after setting up Trusted Publishing

permissions:
  contents: read
  id-token: write # required to request the OIDC token for trusted publishing

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish if the version changed
        working-directory: packages/sdk
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "")
          if [ "$VERSION" != "$PUBLISHED" ]; then
            npm publish
          else
            echo "$NAME@$VERSION is already published — skipping"
          fi

  publish-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish if the version changed
        working-directory: packages/viewer
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "")
          if [ "$VERSION" != "$PUBLISHED" ]; then
            npm publish
          else
            echo "$NAME@$VERSION is already published — skipping"
          fi
